name: Tester og bygg

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v4

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Installer låste avhengigheter
        run: npm ci

      - name: Kjør tester
        run: npm test

      - name: Bygg prosjektet
        run: npm run build
