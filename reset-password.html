<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<title>Nytt passord – KollektivMatch</title>
<meta name="description" content="Velg et nytt passord for KollektivMatch-kontoen din." />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          cream: '#FAF9F6', ink: '#211C33', mist: '#6B667E', line: '#E7E3F5',
          primary: {
            50: '#F4F2FF', 100: '#ECE7FF', 200: '#DAD0FF', 300: '#BFABFF',
            400: '#9F7CFF', 500: '#8449FF', 600: '#6C4CE0', 700: '#5A3EC2',
            800: '#4A349E', 900: '#3D2E7D',
          },
        },
        fontFamily: {
          display: ['"Space Grotesk"', 'sans-serif'],
          sans: ['"Inter"', 'sans-serif'],
        },
      },
    },
  };
</script>
<link rel="stylesheet" href="css/style.css?v=20260823-4" />
</head>
<body class="bg-cream text-ink font-sans antialiased min-h-screen flex items-center justify-center p-5">

  <div class="w-full max-w-sm bg-white rounded-3xl border border-line p-7 shadow-sm">
    <a href="index.html" class="font-display font-bold text-lg flex items-center gap-2.5 mb-6">
      <svg width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect x="13" y="3" width="16" height="16" rx="5" fill="#BFABFF"/>
        <rect x="3" y="7" width="16" height="16" rx="5" fill="#6C4CE0"/>
      </svg>
      KollektivMatch
    </a>

    <div id="loading-state" class="text-center py-6 text-sm text-mist" aria-live="polite">Sjekker lenken din …</div>

    <div id="invalid-state" class="hidden text-center space-y-3" aria-live="assertive">
      <p class="text-sm text-mist">Denne lenken er ugyldig eller har gått ut. Be om en ny fra innloggingsvinduet.</p>
      <a href="index.html" class="inline-block px-5 py-2.5 bg-primary-50 hover:bg-primary-100 text-primary-700 text-sm font-semibold rounded-xl transition-colors">Tilbake til forsiden</a>
    </div>

    <form id="reset-form" class="hidden space-y-3">
      <h1 class="font-display font-bold text-xl mb-1">Velg nytt passord</h1>
      <label for="new-password" class="sr-only">Nytt passord</label>
      <input id="new-password" required type="password" name="password" minlength="10" placeholder="Nytt passord (min. 10 tegn)" autocomplete="new-password"
             class="w-full px-4 py-3 rounded-xl border border-line text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500" />
      <label for="confirm-new-password" class="sr-only">Gjenta nytt passord</label>
      <input id="confirm-new-password" required type="password" name="passwordConfirm" minlength="10" placeholder="Gjenta nytt passord" autocomplete="new-password"
             class="w-full px-4 py-3 rounded-xl border border-line text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500" />
      <button type="submit" id="reset-submit-btn" class="w-full py-3 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-xl transition-colors disabled:opacity-60">Lagre nytt passord</button>
      <p class="text-center text-xs text-mist"><a href="privacy.html" class="text-primary-700 hover:underline">Personvern</a></p>
    </form>

    <div id="success-state" class="hidden text-center space-y-3" aria-live="polite">
      <p class="text-sm text-mist">Passordet er oppdatert. Du kan nå logge inn.</p>
      <a href="index.html" class="inline-block px-5 py-2.5 bg-primary-600 hover:bg-primary-700 text-white text-sm font-semibold rounded-xl transition-colors">Til forsiden</a>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-5 right-5 z-[60] flex flex-col items-end" aria-live="polite"></div>
  <script type="module" src="reset-password.js?v=20260823-2"></script>
</body>
</html>
